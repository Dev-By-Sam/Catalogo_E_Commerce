version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-kinetic_ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kinetic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kinetic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kinetic_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: kinetic_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-kinetic_ecommerce}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      STORE_WHATSAPP_NUMBER: ${STORE_WHATSAPP_NUMBER}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kinetic_network

  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    container_name: kinetic_storefront
    restart: unless-stopped
    environment:
      PORT: 3000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://backend:4000/api}
      STORE_WHATSAPP_NUMBER: ${STORE_WHATSAPP_NUMBER}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kinetic_network

volumes:
  postgres_data:
  redis_data:

networks:
  kinetic_network:
    driver: bridge
